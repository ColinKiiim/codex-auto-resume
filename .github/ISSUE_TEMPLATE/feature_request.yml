name: Feature request / 功能建议
description: Describe a workflow you want to improve / 描述需要改进的使用场景
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow / 问题或使用场景
      description: What happens today, and what would you like to do? / 当前发生什么，希望如何使用？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior / 希望的行为
      description: Describe the outcome and any alternatives you have tried. / 描述结果及已尝试的方法。
    validations:
      required: true
